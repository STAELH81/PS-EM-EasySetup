name: Publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check if release already exists
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

      - name: Install dependencies
        if: steps.release_check.outputs.exists != 'true'
        run: npm install

      - name: Check JavaScript syntax
        if: steps.release_check.outputs.exists != 'true'
        run: npm run check

      - name: Build NSIS installer
        if: steps.release_check.outputs.exists != 'true'
        run: npm run build

      - name: Publish GitHub release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "No Windows installer was produced."
          }

          $notes = @"
          PS2-EM EasySetup v$env:VERSION

          First public Windows installer milestone.

          Highlights:
          - PS2 BIOS dump validation
          - Removable USB detection
          - Official BIOSDrain USB preparation
          - FreeMcBoot / FreeDVDBoot guidance
          - PCSX2 detection and optional WinGet installation
          - BIOS workspace preparation
          - PS2 game-library folder creation
          - Controller detection
          - Final setup dashboard

          No Sony BIOS files or game images are included.
          "@

          gh release create "v$env:VERSION" `
            "$($installer.FullName)#PS2-EM EasySetup v$env:VERSION Windows Installer" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "PS2-EM EasySetup v$env:VERSION" `
            --notes "$notes"
