<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PS-EM EasySetup</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">PS</div>
        <div>
          <h1>PS-EM</h1>
          <p>EasySetup</p>
        </div>
      </div>

      <nav id="stepList" class="step-list"></nav>

      <div class="sidebar-tools">
        <span id="languageLabel">Language</span>
        <div class="language-switcher" role="group" aria-label="Language">
          <button type="button" data-language="fr">FR</button>
          <button type="button" data-language="en">EN</button>
        </div>
      </div>

      <div class="sidebar-note">
        <strong>v0.5</strong>
        <span>PS1 + PS2 multi-console</span>
      </div>
    </aside>

    <section class="content">
      <div id="screen" class="screen"></div>

      <footer class="footer">
        <button id="backButton" class="button ghost">Back</button>
        <div class="footer-spacer"></div>
        <button id="nextButton" class="button primary">Next</button>
      </footer>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
